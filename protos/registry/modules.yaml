# protos/registry/modules.yaml
#
# Machine-readable manifest of every HAL module exposed over the proto layer.
#
# Fields:
#   id           — wire identifier (must be unique and permanent; never reuse)
#   proto_package — fully-qualified proto package name
#   config_type  — fully-qualified proto type for the module Config message
#   result_type  — fully-qualified proto type for the module Result message
#   version      — integer; increment when the proto contract changes
#   status       — "active" | "deprecated"
#   source_path  — repo-relative path to the C++ header this proto was derived from
#
# Adding a module: append a new entry here and create protos/modules/<id>.proto.
# No other file needs to change.

modules:
  - id: audio_interfaces
    proto_package: hal.modules.audio_interfaces
    config_type: hal.modules.audio_interfaces.Config
